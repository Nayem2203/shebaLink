name: ShebaLink CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend (Next.js Typecheck, Lint, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit & mock tests
        run: npm test

      - name: Verify Next.js production build
        run: npm run build

  backend-ci:
    name: Backend (PyTest, Coverage & OpenAPI Contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: pip install fastapi uvicorn pydantic pydantic-settings httpx pytest pytest-cov

      - name: Run PyTest suite with coverage gate (>= 85%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Verify exported OpenAPI 3.1 contract matches FastAPI app
        run: python scripts/export_openapi.py --check
